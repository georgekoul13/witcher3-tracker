<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    The app's own mark, not the game's: a map pin, because the whole app is a
    map, carrying a check, because the whole point is getting to 100%. Drawn in
    the product palette (#131313 ground, #E9FF69 lime) so the home screen and
    the app agree with each other.
  -->
  <rect width="512" height="512" rx="112" fill="#131313"/>
  <path d="M152 222a104 104 0 1 1 208 0c0 69-56 112-104 190-48-78-104-121-104-190Z"
        fill="#E9FF69"/>
  <path d="M214 221l30 31 54-58" fill="none" stroke="#131313"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
